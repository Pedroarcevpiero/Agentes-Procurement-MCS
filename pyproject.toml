[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-agents"
version = "0.1.0"
description = "Sistema agentico de procurement en produccion sobre Claude Agent SDK: Category Copilot / Spend Analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Procurement Agents Team" }]

dependencies = [
    "claude-agent-sdk>=0.1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "faker>=24.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "arize-phoenix-otel>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
